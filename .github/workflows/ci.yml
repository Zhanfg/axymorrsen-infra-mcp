name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build OCI image
        run: docker build --tag axymorrsen-infra-mcp:ci .

      - name: Verify OCI remote binding fails closed without JWT auth
        shell: bash
        run: |
          set +e
          output="$(docker run --rm axymorrsen-infra-mcp:ci 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Expected container startup to fail without remote JWT auth" >&2
            exit 1
          fi

          printf '%s' "$output" | grep -q "only permits loopback binding"
