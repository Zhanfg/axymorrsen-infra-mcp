name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          MCP_INTEGRATION_URL: ${{ vars.MCP_INTEGRATION_URL }}
          MCP_INTEGRATION_TOKEN_ENDPOINT: ${{ vars.MCP_INTEGRATION_TOKEN_ENDPOINT }}
          MCP_INTEGRATION_CLIENT_ID: ${{ vars.MCP_INTEGRATION_CLIENT_ID }}
          MCP_INTEGRATION_SCOPE: ${{ vars.MCP_INTEGRATION_SCOPE }}
          MCP_INTEGRATION_EXPECTED_SUBJECT: ${{ vars.MCP_INTEGRATION_EXPECTED_SUBJECT }}
          MCP_INTEGRATION_ACCESS_TOKEN: ${{ secrets.MCP_INTEGRATION_ACCESS_TOKEN }}
          MCP_INTEGRATION_CLIENT_SECRET: ${{ secrets.MCP_INTEGRATION_CLIENT_SECRET }}
          MCP_INTEGRATION_REFRESH_TOKEN: ${{ secrets.MCP_INTEGRATION_REFRESH_TOKEN }}

      - name: Build
        run: npm run build

      - name: Build release bundle
        run: bash scripts/build-release-bundle.sh /tmp/release-bundle

      - name: Verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -s "/tmp/release-bundle/axymorrsen-infra-mcp-v${version}-node.tgz"
          test -s /tmp/release-bundle/sbom.cdx.json
          test -s /tmp/release-bundle/SHA256SUMS
          (
            cd /tmp/release-bundle
            sha256sum --check SHA256SUMS
          )

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build OCI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: axymorrsen-infra-mcp:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Verify OCI remote binding fails closed without authentication
        shell: bash
        run: |
          set +e
          output="$(docker run --rm axymorrsen-infra-mcp:ci 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Expected container startup to fail without remote JWT auth" >&2
            exit 1
          fi

          printf '%s' "$output" | grep -q "only permits loopback binding"
