name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build release bundle
        run: bash scripts/build-release-bundle.sh /tmp/release-bundle

      - name: Verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/release-bundle/axymorrsen-infra-mcp-v0.8.0-node.tgz
          test -s /tmp/release-bundle/sbom.cdx.json
          test -s /tmp/release-bundle/SHA256SUMS
          (
            cd /tmp/release-bundle
            sha256sum --check SHA256SUMS
          )

      - name: Build OCI image
        run: docker build --tag axymorrsen-infra-mcp:ci .

      - name: Verify OCI remote binding fails closed without JWT auth
        shell: bash
        run: |
          set +e
          output="$(docker run --rm axymorrsen-infra-mcp:ci 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Expected container startup to fail without remote JWT auth" >&2
            exit 1
          fi

          printf '%s' "$output" | grep -q "only permits loopback binding"
